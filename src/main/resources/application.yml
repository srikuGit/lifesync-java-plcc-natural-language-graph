server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  thymeleaf:
    cache: false
  mail:
    host: ${DEMO_SMTP_HOST:localhost}
    port: ${DEMO_SMTP_PORT:1025}
    properties:
      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USER:neo4j}
      password: ${NEO4J_PASSWORD:localDemoPassword123}
  ai:
    retry:
      max-attempts: 1
    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:qwen2.5:1.5b}
          temperature: 0.1
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never
lifesync:
  campaign:
    mail-from: ${DEMO_MAIL_FROM:bank@example.test}
    mail-to: ${DEMO_MAIL_TO:banker@example.test}
  legacy-ingestion-enabled: ${LEGACY_INGESTION_ENABLED:false}
  ui-content-enabled: ${UI_CONTENT_ENABLED:true}
  graph-mcp-url: ${GRAPH_MCP_URL:http://127.0.0.1:8080/mcp}
  input-dir: ${DEMO_INPUT_DIR:./data/input}
  semantic-classification-cache-dir: ${SEMANTIC_CLASSIFICATION_CACHE_DIR:./data/cache/category-classification}
  semantic-classification-min-score: ${SEMANTIC_CLASSIFICATION_MIN_SCORE:0.57}
  semantic-classification-relative-margin: ${SEMANTIC_CLASSIFICATION_RELATIVE_MARGIN:0.09}
  llm-explanations-enabled: ${LLM_EXPLANATIONS_ENABLED:true}
  nl-query-llm-enabled: ${NL_QUERY_LLM_ENABLED:true}
  vector-enabled: ${VECTOR_ENABLED:false}
  vector-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
  vector-backfill-batch-size: ${VECTOR_BACKFILL_BATCH_SIZE:2}
  vector-backfill-delay-ms: ${VECTOR_BACKFILL_DELAY_MS:45000}
  scheduler-enabled: ${SCHEDULER_ENABLED:false}
  scheduler-batch-size: ${SCHEDULER_BATCH_SIZE:2}
  scheduler-delay-ms: ${SCHEDULER_DELAY_MS:90000}
  demo-bank-name: DEMO bank
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}
  consent:
    secret: ${CONSENT_SECRET:}
  offers:
    enabled: ${OFFERS_ENABLED:true}
    base-url: ${OFFERS_BASE_URL:http://localhost:8080/mock-offers}
    api-key: ${OFFERS_API_KEY:}

  geocoding:
    url: ${GEOCODING_URL:https://geocoding.geo.census.gov/geocoder/locations/onelineaddress}
    cache-dir: ${GEOCODING_CACHE_DIR:./data/cache/geocoding}
