services:
  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/localDemoPassword123
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - '127.0.0.1:7474:7474'
      - '127.0.0.1:7687:7687'
    volumes:
      - neo4j_data_us:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p localDemoPassword123 'RETURN 1;' > /dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 20

  ollama:
    image: ollama/ollama:latest
    ports:
      - '127.0.0.1:11434:11434'
    volumes:
      - ollama_models_us:/root/.ollama

  pull-models:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do
          echo 'Waiting for Ollama service...'
          sleep 3
        done
        ollama pull nomic-embed-text
        ollama pull qwen2.5:1.5b
        echo 'Embedding and chat models are ready.'
    restart: 'no'

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
      pull-models:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: localDemoPassword123
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: qwen2.5:1.5b
      OLLAMA_EMBED_MODEL: nomic-embed-text
      DEMO_INPUT_DIR: /app/data/input
      GEOCODER_CACHE_FILE: /app/data/cache/geocodes-cache.json
      GEOCODING_PROVIDER: ${GEOCODING_PROVIDER:-offline}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-}
      LLM_CLASSIFICATION_ENABLED: ${LLM_CLASSIFICATION_ENABLED:-false}
      CLASSIFICATION_CACHE_DIR: /app/data/cache/classifications
      EMBED_ON_START: ${EMBED_ON_START:-true}
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./data/input:/app/data/input:ro
      - ./data/cache:/app/data/cache

volumes:
  neo4j_data_us:
  ollama_models_us:
