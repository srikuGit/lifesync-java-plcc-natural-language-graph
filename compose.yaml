# Based on the user's Compose file. Tuned for an 8 GB host.
services:
  neo4j:
    image: neo4j:5.26.0
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-localDemoPassword123}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    volumes:
      - neo4j_data_us:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD:-localDemoPassword123}' 'RETURN 1;' >/dev/null 2>&1"]
      interval: 10s
      timeout: 8s
      retries: 25

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: 5s
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models_us:/root/.ollama

  pull-models:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      EMBED_ON_START: ${EMBED_ON_START:-true}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until ollama list >/dev/null 2>&1; do sleep 3; done
        ollama pull "$${OLLAMA_CHAT_MODEL}"
        if [ "$${EMBED_ON_START}" = "true" ]; then ollama pull "$${OLLAMA_EMBED_MODEL}"; fi
    restart: "no"

  app:
    build: .
    depends_on:
      neo4j:
        condition: service_healthy
      pull-models:
        condition: service_completed_successfully
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-localDemoPassword123}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-qwen2.5:1.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      DEMO_INPUT_DIR: /app/data/input
      SEMANTIC_CLASSIFICATION_CACHE_DIR: /app/data/cache/category-classification
      SEMANTIC_CLASSIFICATION_MIN_SCORE: ${SEMANTIC_CLASSIFICATION_MIN_SCORE:-0.57}
      SEMANTIC_CLASSIFICATION_RELATIVE_MARGIN: ${SEMANTIC_CLASSIFICATION_RELATIVE_MARGIN:-0.09}
      LLM_EXPLANATIONS_ENABLED: ${LLM_EXPLANATIONS_ENABLED:-true}
      NL_QUERY_LLM_ENABLED: ${NL_QUERY_LLM_ENABLED:-true}
      VECTOR_ENABLED: ${VECTOR_ENABLED:-true}
      VECTOR_BACKFILL_BATCH_SIZE: ${VECTOR_BACKFILL_BATCH_SIZE:-2}
      VECTOR_BACKFILL_DELAY_MS: ${VECTOR_BACKFILL_DELAY_MS:-45000}
      EMBED_ON_START: ${EMBED_ON_START:-true}
      OFFERS_ENABLED: ${OFFERS_ENABLED:-true}
      OFFERS_BASE_URL: ${OFFERS_BASE_URL:-http://localhost:8080/mock-offers}
      OFFERS_API_KEY: ${OFFERS_API_KEY:-}
      CONSENT_SECRET: ${CONSENT_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-1}
      SCHEDULER_DELAY_MS: ${SCHEDULER_DELAY_MS:-90000}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/input:/app/data/input:ro
      - ./data/cache:/app/data/cache
    restart: unless-stopped

volumes:
  neo4j_data_us:
  ollama_models_us:
